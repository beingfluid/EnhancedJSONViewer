<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced JSON Viewer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
</head>
<body>
    <div class="app">
        <!-- Toolbar -->
        <header class="toolbar">
            <div class="toolbar-left">
                <div class="app-brand">
                    <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7" rx="1"/>
                        <rect x="14" y="3" width="7" height="7" rx="1"/>
                        <rect x="3" y="14" width="7" height="7" rx="1"/>
                        <rect x="14" y="14" width="7" height="7" rx="1"/>
                    </svg>
                    <span class="brand-name">JSON Table Viewer</span>
                </div>
            </div>
            <div class="toolbar-center">
                <div class="toolbar-actions">
                    <label class="tool-btn" for="file-input" title="Open JSON file (Ctrl+O)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1"/>
                            <path d="M14 15l-3-3m0 0l3-3m-3 3h8"/>
                        </svg>
                        <span>Open</span>
                    </label>
                    <input type="file" id="file-input" accept=".json,application/json" hidden>

                    <button class="tool-btn" id="save-btn" disabled title="Save JSON file (Ctrl+S)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
                            <polyline points="17,21 17,13 7,13 7,21"/>
                            <polyline points="7,3 7,8 15,8"/>
                        </svg>
                        <span>Save</span>
                    </button>

                    <div class="toolbar-divider"></div>

                    <button class="tool-btn" id="render-btn" title="Render table (Ctrl+Enter)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="5,3 19,12 5,21"/>
                        </svg>
                        <span>Render</span>
                    </button>

                    <button class="tool-btn" id="sync-json-btn" disabled title="Sync edits back to JSON">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23,4 23,10 17,10"/>
                            <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
                        </svg>
                        <span>Sync</span>
                    </button>

                    <div class="toolbar-divider"></div>

                    <button class="tool-btn" id="sample-btn" title="Load sample data">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                            <polyline points="14,2 14,8 20,8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                        </svg>
                        <span>Sample</span>
                    </button>

                    <button class="tool-btn" id="clear-btn" title="Clear everything">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3,6 5,6 21,6"/>
                            <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                        </svg>
                        <span>Clear</span>
                    </button>
                </div>
            </div>
            <div class="toolbar-right">
                <button class="tool-btn icon-only" id="theme-toggle" title="Toggle dark/light mode">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Input Panel -->
            <div class="panel input-panel" id="input-panel">
                <div class="panel-header">
                    <span class="panel-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="panel-icon">
                            <polyline points="16,18 22,12 16,6"/>
                            <polyline points="8,6 2,12 8,18"/>
                        </svg>
                        JSON Input
                    </span>
                    <button class="panel-toggle" id="toggle-input" title="Toggle input panel">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="15,18 9,12 15,6"/>
                        </svg>
                    </button>
                </div>
                <div class="panel-body">
                    <textarea id="json-input" placeholder="Paste JSON here, or use Open to load a file..." spellcheck="false"></textarea>
                </div>
                <div id="error-message" class="error-bar hidden"></div>
            </div>

            <!-- Resize Handle -->
            <div class="resize-handle" id="resize-handle"></div>

            <!-- Output Panel -->
            <div class="panel output-panel" id="output-panel">
                <div class="panel-header">
                    <span class="panel-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="panel-icon">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <line x1="3" y1="9" x2="21" y2="9"/>
                            <line x1="9" y1="21" x2="9" y2="9"/>
                        </svg>
                        Table View
                        <span class="dirty-badge hidden" id="dirty-badge">modified</span>
                    </span>
                    <div class="panel-actions">
                        <button class="panel-btn" id="collapse-all-btn" title="Collapse all">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="4,14 12,6 20,14"/>
                            </svg>
                        </button>
                        <button class="panel-btn" id="expand-all-btn" title="Expand all">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="4,10 12,18 20,10"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="panel-body">
                    <div id="table-container" class="table-container">
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="empty-icon">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <line x1="3" y1="9" x2="21" y2="9"/>
                                <line x1="3" y1="15" x2="21" y2="15"/>
                                <line x1="9" y1="3" x2="9" y2="21"/>
                                <line x1="15" y1="3" x2="15" y2="21"/>
                            </svg>
                            <p>Paste JSON and click <strong>Render</strong> to view as a table</p>
                            <p class="empty-hint">Or press Ctrl+Enter &bull; Click cells to edit values</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <footer class="status-bar">
            <span class="status-left" id="status-text">Ready</span>
            <span class="status-right">
                <span id="stats-text"></span>
            </span>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
